name: Daily News Email

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 5:30pm Eastern during daylight time (EDT), weekdays
    - cron: "30 22 * * 1-5"   # 5:30pm Eastern during standard time (EST), weekdays
  workflow_dispatch:        # lets you run it manually to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python daily_news.py
